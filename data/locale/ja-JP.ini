ProcessMonitor.SystemCpuHelp="すべての論理プロセッサーの CPU 使用率です。100% は全体の処理能力を使用している状態です。"
ProcessMonitor.SystemMemoryHelp="使用中の物理メモリ / 物理メモリ総量です。単位は二進単位です（1 GiB = 1024 MiB）。バーは総 RAM に対する使用割合です。"
ProcessMonitor.ProcessCpuHelp="この OBS プロセスの CPU 使用率を、すべての論理プロセッサーで正規化した値です。100% はコンピューター全体の CPU 処理能力を表します。"
ProcessMonitor.ProcessMemoryHelp="この OBS プロセスに常駐する物理メモリ（ワーキングセット）です。バーはシステムの総 RAM に対する割合です。共有ページは他のプロセスにも属する場合があります。"
ProcessMonitor.AdapterHelp="選択した GPU の、全プロセスを含む値です。OBS だけの使用量ではありません。取得できない値を 0 として表示しません。"
ProcessMonitor.GpuHelp="この GPU で最も使用率が高いエンジンの値です。全プロセスを含み、異なるエンジンの使用率は合算しません。"
ProcessMonitor.GpuMemoryHelp="専用ビデオメモリの使用量 / この GPU の物理的な専用メモリ容量です。共有システムメモリは含みません。「—」は総量を取得できない状態を表し、バーを表示しません。"
ProcessMonitor.UpdateHelp="この dock の表示中に約 1 秒間隔で計測します。「計測中」は初回の区間計測待ち、「取得不可」は現在値の取得失敗、「非対応」はシステムが指標を提供していない状態です。"