ProcessMonitor.SystemCpuHelp="CPU use across all logical processors. 100% means all processors are busy."
ProcessMonitor.SystemMemoryHelp="Physical system memory in use / total physical memory. Units are binary (1 GiB = 1024 MiB). The bar shows the used share of total RAM."
ProcessMonitor.ProcessCpuHelp="CPU used by this OBS process, normalized across all logical processors. 100% means the total CPU capacity of the computer."
ProcessMonitor.ProcessMemoryHelp="Physical memory resident in this OBS process (working set). The bar shows its share of total system RAM. Shared pages may also belong to other processes."
ProcessMonitor.AdapterHelp="Values apply to the selected graphics adapter across all processes, not only OBS. An unavailable counter is never shown as zero."
ProcessMonitor.GpuHelp="Use of the busiest engine on this graphics adapter, including all processes. Different engines are not added together."
ProcessMonitor.GpuMemoryHelp="Dedicated video memory in use / physical dedicated capacity of this adapter. Shared system memory is excluded. A dash means the total could not be obtained; the bar is hidden."
ProcessMonitor.UpdateHelp="Samples about once per second while this dock is visible. Collecting means a rate needs its first interval; unavailable means the current reading failed; not supported means this metric is not exposed by the system."