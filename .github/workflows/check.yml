name: Harness checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metrics-math:
    name: metrics-math (C++17, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile and run pure metric calculations
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -I . src/metrics/MetricMath.cpp tests/metrics/MetricMathTests.cpp -o "$RUNNER_TEMP/metric-math-tests"
          "$RUNNER_TEMP/metric-math-tests"
  harness-checks:
    name: harness-checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check.py
